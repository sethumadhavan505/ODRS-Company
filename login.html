<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup Form</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="auth-wrapper">
        <div class="background-shape"></div>
        <div class="secondary-shape"></div>

        <div class="credentials-panel signin">
            <h2 class="slide-element">Login</h2>
            <form action="#">
                <div class="field-wrapper slide-element">
                    <input type="email" id="loginEmail" required autocomplete="email">
                    <label>Email</label>
                    <i class="fa-solid fa-envelope"></i>
                </div>

                <div class="field-wrapper slide-element password-field">
                    <input type="password" id="loginPassword" required>
                    <label>Password</label>

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword('loginPassword', this)"
                        aria-label="Show password">
                        <i class="fa-solid fa-eye-slash"></i>
                    </button>
                </div>

                <div class="field-wrapper slide-element">
                    <button type="button" class="submit-button" onclick="login()">Login</button>
                </div>

                <div class="switch-link slide-element">
                    <p>Don't have an account? <br> 
                        <a href="#" class="register-trigger">Sign Up</a>
                    </p>
                </div>
            </form>
        </div>

        <div class="welcome-section signin">
            <h2 class="slide-element">WELCOME BACK!</h2>
        </div>

        <div class="credentials-panel signup">
            <h2 class="slide-element">Register</h2>
            <form action="#">
                <div class="field-wrapper slide-element">
                    <input type="text" id="regUsername" required>
                    <label>Username</label>
                    <i class="fa-solid fa-user"></i>
                </div>

                <div class="field-wrapper slide-element">
                    <input type="email" id="regEmail" required>
                    <label>Email</label>
                    <i class="fa-solid fa-envelope"></i>
                </div>
                
                <div class="google-auth-block slide-element">
                    <button type="button" class="google-signin-button" onclick="googleRegisterNotice()">
                        <span class="google-logo" aria-hidden="true">G</span>
                        Continue with Google
                    </button>
                    <div class="auth-divider"><span>or register with email</span></div>
                </div>

                <div class="field-wrapper slide-element password-field">
                    <input type="password" id="regPassword" required>
                    <label>Password</label>

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword('regPassword', this)"
                        aria-label="Show password">
                        <i class="fa-solid fa-eye-slash"></i>
                    </button>
                </div>

                <div class="field-wrapper slide-element">
                    <button type="button" class="submit-button" onclick="register()">Register</button>
                </div>

                <div class="switch-link slide-element">
                    <p>Already have an account? <br> 
                        <a href="#" class="login-trigger">Sign In</a>
                    </p>
                </div>
            </form>
        </div>

        <div class="welcome-section signup">
            <h2 class="slide-element">WELCOME!</h2>
        </div>
    </div>

    <div class="footer">
        <p>Made with ❤️ by ODRS TEAM</p>
    </div>

    <script src="style.js"></script>
>

<!-- Warning Popup -->
<div id="warningPopup" class="warning-popup">
    <div class="warning-box">
        <div class="warning-icon">⚠️</div>
        <h2>ODRS SECURITY WARNING</h2>
        <p>Unauthorized inspection or source viewing is not allowed.</p>
        <button onclick="closeWarning()">OK</button>
    </div>
</div>

<style>
.warning-popup{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    justify-content:center;
    align-items:center;
    z-index:99999;
}
.warning-box{
    background:#fff;
    padding:25px;
    border-radius:15px;
    text-align:center;
    width:350px;
    box-shadow:0 0 25px rgba(0,0,0,0.3);
}
.warning-icon{
    font-size:60px;
}
.warning-box h2{
    color:#e53935;
    margin:10px 0;
}
.warning-box p{
    color:#555;
}
.warning-box button{
    margin-top:15px;
    padding:10px 20px;
    border:none;
    border-radius:8px;
    background:#e53935;
    color:white;
    cursor:pointer;
}
</style>

<script>
function showWarning() {
    document.getElementById("warningPopup").style.display = "flex";
}

function closeWarning() {
    document.getElementById("warningPopup").style.display = "none";
}

// Right Click
document.addEventListener("contextmenu", function(e) {
    e.preventDefault();
    showWarning();
});

// Keyboard Shortcuts
document.addEventListener("keydown", function(e) {
    if (
        e.key === "F12" ||
        (e.ctrlKey && e.shiftKey && ["I", "J", "C"].includes(e.key.toUpperCase())) ||
        (e.ctrlKey && e.key.toUpperCase() === "U")
    ) {
        e.preventDefault();
        showWarning();
    }
});
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup,
  createUserWithEmailAndPassword, signInWithEmailAndPassword,
  updateProfile, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAd3r79qIm7SJWjUXrol5K6fuU2_gpseew",
  authDomain: "odrs-login.firebaseapp.com",
  projectId: "odrs-login",
  storageBucket: "odrs-login.firebasestorage.app",
  messagingSenderId: "948294188520",
  appId: "1:948294188520:web:721377ae39f5f4e214785d",
  measurementId: "G-FYRJJG7TVR"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const googleProvider = new GoogleAuthProvider();

function saveUserAndGoHome(user, fallbackName = "") {
  localStorage.setItem("username", user.displayName || fallbackName || user.email?.split("@")[0] || "User");
  localStorage.setItem("email", user.email || "");
  window.location.href = "home.html";
}

onAuthStateChanged(auth, (user) => {
  if (user && window.location.pathname.endsWith("login.html")) {
    // Keep the sign-up/login page visible unless a user has just signed in.
  }
});

window.register = async function () {
  const username = document.getElementById("regUsername").value.trim();
  const email = document.getElementById("regEmail").value.trim();
  const password = document.getElementById("regPassword").value;
  if (!username || !email || !password) {
    alert("Please fill in all registration fields.");
    return;
  }
  if (password.length < 6) {
    alert("Password must be at least 6 characters.");
    return;
  }
  const button = document.querySelector(".signup .submit-button");
  button.disabled = true;
  try {
    const credential = await createUserWithEmailAndPassword(auth, email, password);
    await updateProfile(credential.user, { displayName: username });
    saveUserAndGoHome(credential.user, username);
  } catch (error) {
    const messages = {
      "auth/email-already-in-use": "This email already has an account. Please sign in.",
      "auth/invalid-email": "Please enter a valid email address.",
      "auth/weak-password": "Password is too weak. Use at least 6 characters."
    };
    alert(messages[error.code] || error.message || "Registration failed.");
  } finally {
    button.disabled = false;
  }
};

window.login = async function () {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  if (!email || !password) {
    alert("Please enter your email and password.");
    return;
  }
  const button = document.querySelector(".signin .submit-button");
  button.disabled = true;
  try {
    const credential = await signInWithEmailAndPassword(auth, email, password);
    saveUserAndGoHome(credential.user);
  } catch (error) {
    const messages = {
      "auth/invalid-credential": "Email or password is incorrect.",
      "auth/user-not-found": "No account found for this email.",
      "auth/wrong-password": "Incorrect password.",
      "auth/invalid-email": "Please enter a valid email address.",
      "auth/too-many-requests": "Too many attempts. Please try again later."
    };
    alert(messages[error.code] || error.message || "Login failed.");
  } finally {
    button.disabled = false;
  }
};

window.googleRegisterNotice = async function () {
  const button = document.querySelector(".google-signin-button");
  button.disabled = true;
  try {
    const result = await signInWithPopup(auth, googleProvider);
    saveUserAndGoHome(result.user);
  } catch (error) {
    const messages = {
      "auth/popup-closed-by-user": "Google sign-in was cancelled.",
      "auth/unauthorized-domain": "This website domain is not authorized in Firebase Authentication."
    };
    alert(messages[error.code] || error.message || "Google sign-in failed.");
  } finally {
    button.disabled = false;
  }
};
</script>
</body>
</html>
