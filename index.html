<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup Form</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="auth-wrapper">
        <div class="background-shape"></div>
        <div class="secondary-shape"></div>

        <div class="credentials-panel signin">
            <h2 class="slide-element">Login</h2>
            <form action="#">
                <div class="field-wrapper slide-element">
                    <input type="text" id="loginUsername" required>
                    <label>Username</label>
                    <i class="fa-solid fa-user"></i>
                </div>

                <div class="field-wrapper slide-element">
                    <input type="password" id="loginPassword" required>
                    <label>Password</label>
                    <i class="fa-solid fa-lock"></i>
                </div>

                <div class="field-wrapper slide-element">
                    <button type="button" class="submit-button" onclick="login()">Login</button>
                </div>

                <div class="switch-link slide-element">
                    <p>Don't have an account? <br> 
                        <a href="#" class="register-trigger">Sign Up</a>
                    </p>
                </div>
            </form>
        </div>

        <div class="welcome-section signin">
            <h2 class="slide-element">WELCOME BACK!</h2>
        </div>

        <div class="credentials-panel signup">
            <h2 class="slide-element">Register</h2>
            <form action="#">
                <div class="field-wrapper slide-element">
                    <input type="text" id="regUsername" required>
                    <label>Username</label>
                    <i class="fa-solid fa-user"></i>
                </div>

                <div class="field-wrapper slide-element">
                    <input type="email" id="regEmail" required>
                    <label>Email</label>
                    <i class="fa-solid fa-envelope"></i>
                </div>

                <div class="field-wrapper slide-element">
                    <input type="password" id="regPassword" required>
                    <label>Password</label>
                    <i class="fa-solid fa-lock"></i>
                </div>

                <div class="field-wrapper slide-element">
                    <button type="button" class="submit-button" onclick="register()">Register</button>
                </div>

                <div class="switch-link slide-element">
                    <p>Already have an account? <br> 
                        <a href="#" class="login-trigger">Sign In</a>
                    </p>
                </div>
            </form>
        </div>

        <div class="welcome-section signup">
            <h2 class="slide-element">WELCOME!</h2>
        </div>
    </div>

    <div class="footer">
        <p>Made with ❤️ by ODRS TEAM</p>
    </div>

    <script src="style.js"></script>
<script>
// REGISTER FUNCTION
function register() {
  let username = document.getElementById("regUsername").value;
  let email = document.getElementById("regEmail").value;
  let password = document.getElementById("regPassword").value;

  localStorage.setItem("regUsername", username);
  localStorage.setItem("regEmail", email);
  localStorage.setItem("regPassword", password);

  alert("Registered Successfully ✅");
}

// LOGIN FUNCTION
function login() {
  let username = document.getElementById("loginUsername").value;
  let password = document.getElementById("loginPassword").value;

  let storedUser = localStorage.getItem("regUsername");
  let storedPass = localStorage.getItem("regPassword");

  if (username === storedUser && password === storedPass) {

    localStorage.setItem("username", storedUser);
    localStorage.setItem("email", localStorage.getItem("regEmail"));

    window.location.href = "home.html";

  } else {
    alert("Invalid Username or Password ❌");
  }
}
</script>

<!-- Warning Popup -->
<div id="warningPopup" class="warning-popup">
    <div class="warning-box">
        <div class="warning-icon">⚠️</div>
        <h2>ODRS SECURITY WARNING</h2>
        <p>Unauthorized inspection or source viewing is not allowed.</p>
        <button onclick="closeWarning()">OK</button>
    </div>
</div>

<style>
.warning-popup{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    justify-content:center;
    align-items:center;
    z-index:99999;
}
.warning-box{
    background:#fff;
    padding:25px;
    border-radius:15px;
    text-align:center;
    width:350px;
    box-shadow:0 0 25px rgba(0,0,0,0.3);
}
.warning-icon{
    font-size:60px;
}
.warning-box h2{
    color:#e53935;
    margin:10px 0;
}
.warning-box p{
    color:#555;
}
.warning-box button{
    margin-top:15px;
    padding:10px 20px;
    border:none;
    border-radius:8px;
    background:#e53935;
    color:white;
    cursor:pointer;
}
</style>

<script>
function showWarning() {
    document.getElementById("warningPopup").style.display = "flex";
}

function closeWarning() {
    document.getElementById("warningPopup").style.display = "none";
}

// Right Click
document.addEventListener("contextmenu", function(e) {
    e.preventDefault();
    showWarning();
});

// Keyboard Shortcuts
document.addEventListener("keydown", function(e) {
    if (
        e.key === "F12" ||
        (e.ctrlKey && e.shiftKey && ["I", "J", "C"].includes(e.key.toUpperCase())) ||
        (e.ctrlKey && e.key.toUpperCase() === "U")
    ) {
        e.preventDefault();
        showWarning();
    }
});
</script>

</body>
</html>
